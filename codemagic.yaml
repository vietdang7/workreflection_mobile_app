# Cấu hình build máy Mac trên Codemagic — dùng để nộp bản iOS lên App Store.
#
# Vì sao cần file này: máy dev đang là Linux, không archive được IPA. Codemagic
# cho mượn máy Mac có sẵn Xcode + Flutter, ký bằng chứng chỉ lấy tự động từ
# App Store Connect API key, rồi đẩy thẳng lên TestFlight.
#
# Từ 26/08/2026 mọi thứ nằm trong tài khoản của khách: team Apple
# CLOUD & CORAL COMPANY LIMITED (ZZDTT3X3VJ). Team cá nhân "Quoc Viet Dang"
# (4BFVKGCMCQ) là bản dựng cũ, KHÔNG dùng nữa.
#
# Vì bundle id là duy nhất trên toàn Apple, chuỗi cũ
# app.workreflection.workreflectionMobile đang bị team cá nhân giữ và không
# mang sang được — kể cả xoá bên đó Apple cũng không cho đăng ký lại. Nên team
# khách dùng chuỗi mới app.workreflection.mobile. Chuỗi này TRÙNG với URL scheme
# đăng nhập trong ios/Runner/Info.plist, đó là trùng lành: hai thứ khác họ,
# không ràng buộc nhau.
#
# Trước khi chạy lần đầu phải làm 4 việc ngoài repo (xem hướng dẫn kèm theo):
#   1. Tạo App Store Connect API key (quyền App Manager) TRONG TÀI KHOẢN KHÁCH,
#      nạp vào Codemagic team settings với tên integration "workreflection-asc".
#      Chỉ Account Holder/Admin tạo được key này; vai trò App Manager không thấy
#      mục Team Keys trong Users and Access > Integrations.
#   2. Tạo app record trên App Store Connect với bundle id bên dưới.
#   3. Điền APP_STORE_APPLE_ID (số Apple ID của app, xem ở App Information).
#   4. Tạo biến bí mật CERTIFICATE_PRIVATE_KEY trong nhóm "appstore_credentials"
#      trên Codemagic — nội dung là private key RSA sinh bằng:
#         ssh-keygen -t rsa -b 2048 -m PEM -f ios_distribution_private_key -q -N ""
#      Apple ký chứng chỉ phân phối lên đúng key này, nên phải giữ nguyên một key
#      qua các lần build; đổi key là sinh chứng chỉ mới, mà Apple chỉ cho 3 cái.

workflows:
  ios-release:
    name: iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Tên này phải trùng tên API key đã lưu trong Codemagic > Team integrations.
      app_store_connect: workreflection-asc

    environment:
      # Không dùng khối ios_signing: nó chỉ TÌM provisioning profile đã có sẵn
      # trong Codemagic, không tạo mới — mà tài khoản Apple này chưa có profile
      # nào. Thay bằng bước "Fetch signing files" ở dưới, có cờ --create.
      groups:
        # Nhóm biến khai trên Codemagic UI, chứa CERTIFICATE_PRIVATE_KEY.
        - appstore_credentials
      vars:
        BUNDLE_ID: app.workreflection.mobile
        # Apple ID của app record (dãy số ~10 chữ số), dùng để hỏi build number
        # mới nhất trên App Store Connect rồi +1 — tránh trùng số khi nộp.
        # 6805322970 = app "WorkReflection" trong team khách, tạo 26/08/2026.
        # (Số cũ 6798188505 thuộc app bên team cá nhân, đã bỏ.)
        APP_STORE_APPLE_ID: 6805322970
      # Ghim đúng phiên bản máy dev đang dùng để bản build trên CI không lệch.
      flutter: 3.41.4
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Set up keychain
        script: keychain initialize

      - name: Fetch signing files
        # --create: chưa có chứng chỉ/profile trên Developer Portal thì tạo mới.
        # Xác thực lấy từ integration app_store_connect ở trên, chỉ riêng private
        # key của chứng chỉ là phải tự cấp qua CERTIFICATE_PRIVATE_KEY.
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Flutter analyze
        script: flutter analyze

      - name: Flutter test
        script: flutter test

      - name: Build IPA
        script: |
          set -e

          # Số build phải LỚN HƠN mọi bản đã đẩy lên Apple, kể cả bản mới chỉ
          # nằm ở TestFlight chứ chưa phát hành.
          #
          # Bản đầu dùng `get-latest-app-store-build-number`, và nó chỉ đếm
          # build đã lên App Store. Bản hôm 05/8 mới ở TestFlight nên lệnh trả
          # về RỖNG, mà trong bash `$(( + 1))` cho ra 1 — đúng số đã dùng. Kết
          # quả: build xanh, archive xong, chết ở bước upload với
          # ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE.
          #
          # Nay hỏi cả hai nơi rồi lấy số lớn hơn.
          APP_STORE_NUM=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          TESTFLIGHT_NUM=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)

          LATEST=0
          for n in "$APP_STORE_NUM" "$TESTFLIGHT_NUM"; do
            case "$n" in
              ''|*[!0-9]*) continue ;;
            esac
            [ "$n" -gt "$LATEST" ] && LATEST="$n"
          done

          BUILD_NUMBER=$((LATEST + 1))
          echo "Số build đã dùng trên Apple: App Store='$APP_STORE_NUM' TestFlight='$TESTFLIGHT_NUM' → dùng $BUILD_NUMBER"

          flutter build ipa --release \
            --build-name=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1) \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - thedangs7@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Đẩy lên TestFlight mỗi lần build xanh. Khi nào muốn nộp bản chính thức
        # thì bật submit_to_app_store, đừng bật sớm kẻo tốn lượt review.
        submit_to_testflight: true
        submit_to_app_store: false

    triggering:
      # Chưa bật tự động: bấm "Start new build" trên web cho chủ động.
      # Muốn tự chạy khi gắn tag thì mở khối events bên dưới.
      # events:
      #   - tag
      # tag_patterns:
      #   - pattern: 'v*'
      #     include: true
      cancel_previous_builds: true
