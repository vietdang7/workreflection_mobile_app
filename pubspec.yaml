name: workreflection_mobile
description: "WorkReflection mobile app — daily career reflection."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.0
  intl: any
  path_provider: ^2.1.0
  just_audio: ^0.9.40
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  url_launcher: ^6.3.2
  http: ^1.6.0
  pdf: ^3.12.0
  printing: ^5.14.3
  file_picker: ^11.0.3
  # Chỉ dùng cho MỘT việc: xin quyền kho ảnh trước khi đổi ảnh đại diện trên
  # iOS. Xem `lib/features/profile/avatar_providers.dart` và danh sách macro
  # PERMISSION_* trong `ios/Podfile`.
  #
  # GHIM Ở 11.x, đừng nâng lên 13/14: permission_handler_android 14.0.0 dùng
  # `compilerOptions`/`jvmTarget` trong build.gradle.kts, cần Kotlin Gradle
  # plugin mới hơn bản dự án đang dùng — `flutter build apk` gãy ngay ở bước
  # biên dịch script Gradle (thử 27/08). Muốn nâng thì nâng Kotlin/AGP trước.
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/images/wr_logo.png

  # Lora — lớp `.serif` của mockup Sprint 2, dùng cho những câu TRÍCH (Insight
  # gần nhất, "Hệ thống nhận ra"). Nhúng thẳng file chứ không gọi
  # `GoogleFonts.lora()`: google_fonts tải font qua mạng lúc chạy, nên máy
  # offline mất chữ serif và test thì ném lỗi tải font.
  # Nguồn: Google Fonts, giấy phép SIL Open Font License 1.1.
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Italic.ttf
          style: italic
