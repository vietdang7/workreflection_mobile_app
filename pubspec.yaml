name: workreflection_mobile
description: "WorkReflection mobile app — daily career reflection."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.0
  intl: any
  path_provider: ^2.1.0
  just_audio: ^0.9.40
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
